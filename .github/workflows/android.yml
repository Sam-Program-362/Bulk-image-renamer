name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest runners ship the Android SDK (ANDROID_HOME is set);
      # just make sure the platform/build-tools for compileSdk 35 exist.
      - name: Ensure Android SDK platform 35
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies & build web app
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Sync web app into Android project
        run: npx cap sync android

      # Optional release signing. Add these repository secrets to sign the
      # release APK with your own key instead of the debug-key fallback:
      #   ANDROID_KEYSTORE_BASE64    base64-encoded .jks/.keystore file
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Decode release keystore (if secret present)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — release APK will use the debug key."
          fi

      - name: Build debug & release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      # Surface the Gradle failure in the check annotations (full log is the artifact below).
      - name: Report Gradle failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path("gradle-build.log")
          text = log.read_text(errors="replace") if log.exists() else "no gradle log"
          i = text.rfind("* What went wrong")
          tail = (text[i:i + 5500] if i >= 0 else text[-5500:])
          print("::error title=Gradle build failed::" + tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Stage APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/bulk-rename-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/bulk-rename-release.apk"
          ls -lh out

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bulk-rename-apks
          path: out/*.apk
          if-no-files-found: error

      # Pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
      # publishes a GitHub Release with both APKs attached.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bulk Rename ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*.apk
